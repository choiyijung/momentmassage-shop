<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 670" role="img" aria-labelledby="title desc">
<title id="title">하루결케어 창가의 휴식 공간</title><desc id="desc">남색 공간 속 따뜻한 자연광이 드는 창문과 아이보리 의자, 식물의 일러스트</desc>
<defs>
  <linearGradient id="window" x2="0" y2="1"><stop stop-color="#d5e6ee"/><stop offset=".57" stop-color="#adc7d3"/><stop offset="1" stop-color="#628ba2"/></linearGradient>
  <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ebd8b3"/><stop offset="1" stop-color="#b89a62"/></linearGradient>
  <linearGradient id="chair" x2="0" y2="1"><stop stop-color="#f5f0e6"/><stop offset=".62" stop-color="#e7e1d5"/><stop offset="1" stop-color="#b8b5af"/></linearGradient>
  <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#7898aa"/><stop offset="1" stop-color="#344b62"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#f5e7c5" stop-opacity=".85"/><stop offset="1" stop-color="#f5e7c5" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="17"/></filter>
</defs>
